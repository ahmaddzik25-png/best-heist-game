<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Vault - a tiny stealth heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Midnight Vault: a stealth heist game. Cross the museum, dodge the guards' vision cones and the cameras, crack the vault, and escape through the getaway door."></canvas>
<p id="status">Midnight Vault. Move with W A S D or the arrow keys, hold Shift to sneak, hold E beside the vault to crack it, click to throw a coin that distracts the guards, R restarts.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
